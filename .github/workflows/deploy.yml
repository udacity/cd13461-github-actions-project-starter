name: Deploy Test
on:
  push:
    branches: ["main"]
    paths-ignore:
        - ".gitignore"
        - "README.md"
        - "CONTRIBUTING.md"
        - "LICENSE.txt"
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'FORCE DEPLOY: Bypass safety checks?'
        required: true
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      URL_CHECKER_TIMEOUT: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/cache@v4
        with:
          path: ~/.cache
          key: ${{ runner.os }}-dependencies-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-dependencies-
    
      - name: Install dependencies
        run: npm ci
      - name: Run all linters
        run: lint:all
      - name: Run all scripts from folder scripts/
        run: npm run .scripts/**.js
  build:
    runs-on: ubuntu-latest
    env:
      URL_CHECKER_TIMEOUT: 120
      name: github-pages
      PATH_PREFIX: '/cd13461-github-actions-project-starter/'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/cache@v4
        with:
          path: ~/.cache
          key: ${{ runner.os }}-dependencies-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-dependencies-
      - name: Install dependencies
        run: npm ci
      - name: Set PATH_PREFIX and Build
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d '/' -f2-)
          echo "PATH_PREFIX=/$REPO_NAME/" >> $GITHUB_ENV
          export PATH_PREFIX="/$REPO_NAME/"
          npx @11ty/eleventy
      - name: Upload static pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site/'
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - run: |
          gh issue --repo ${{ github.repository }} \
            create --title "{{date}} - Deployment: {{status}}" --body "Issue body"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
